[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "struct_load"
version = "0.1.0"
description = "Building code load determination, ASCE 7 lookups, self-weight, tributary distribution, lateral loads, and LRFD combinations for the Structural Engineering Ecosystem."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abinash Mandal", email = "amandal@unr.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "struct_core>=0.1.0",
    "pydantic>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["struct_load*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
